<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Nexora POS Solutions</title>
    <style>
      html, body { margin:0; min-height:100%; width:100%; background:#040f21; color:#f7fcff; font-family:system-ui, sans-serif; }
      body { display:flex; align-items:center; justify-content:center; padding:1.5rem; text-align:center; }
      a { color:#27cd9e; text-decoration:none; }
      a:hover { text-decoration:underline; }
    </style>
    <script>
      const path = location.pathname.replace(/^\//, '');
      const safePath = path && !path.startsWith('assets/') && !path.startsWith('favicon');
      if (safePath) {
        location.replace('/#' + path + location.search + location.hash);
      } else {
        location.replace('/');
      }
    </script>
  </head>
  <body>
    <div>
      <p>Redirecting to the Nexora homepage…</p>
      <p>If the redirect does not work, <a href="/">click here to continue</a>.</p>
    </div>
  </body>
</html>
